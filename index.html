<!doctype html>
<html lang="hi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<title>SunoBolo</title>
<style>
:root{
  --bg:#07070c; --bg2:#0b0b13; --surf:#101019; --surf2:#15151f; --surf3:#1b1b27;
  --line:#23233a; --line2:#2e2e47;
  --ink:#f3f3f8; --mut:#9494a8; --mut2:#6f6f83;
  --v1:#a855f7; --v2:#6366f1; --v3:#c084fc;
  --ok:#34d399; --low:#fbbf24; --out:#f87171;
  --r:16px; --grad:linear-gradient(135deg,#a855f7 0%,#6366f1 100%);
  --glass:rgba(11,11,19,.80); --scrim:rgba(3,3,8,.72);
  --dots:rgba(168,85,247,.10); --shadow:0 22px 50px rgba(0,0,0,.5);
}
/* Light is a token swap, nothing else. Violet stays - it reads on both. */
:root[data-theme="light"]{
  --bg:#f6f6fa; --bg2:#fff; --surf:#fff; --surf2:#f2f2f7; --surf3:#e7e7ef;
  --line:#e3e3ec; --line2:#d3d3e0;
  --ink:#14141d; --mut:#5c5c70; --mut2:#8a8a9b;
  --v3:#7c3aed; --ok:#059669; --low:#b45309; --out:#dc2626;
  --glass:rgba(255,255,255,.84); --scrim:rgba(20,20,30,.42);
  --dots:rgba(124,58,237,.10); --shadow:0 18px 40px rgba(30,25,60,.14);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{background:var(--bg)}
body{
  margin:0;color:var(--ink);padding-bottom:96px;background:var(--bg);
  font:16px/1.5 "Inter",system-ui,"Segoe UI","Noto Sans","Noto Sans Devanagari","Noto Sans Telugu",sans-serif;
  -webkit-font-smoothing:antialiased;
}
/* the faint dotted field reactbits uses behind everything */
body::before{
  content:"";position:fixed;inset:0;z-index:0;pointer-events:none;
  background-image:radial-gradient(circle,var(--dots) 1px,transparent 1px);
  background-size:22px 22px;
  -webkit-mask-image:radial-gradient(ellipse 80% 60% at 50% 0%,#000 40%,transparent 100%);
  mask-image:radial-gradient(ellipse 80% 60% at 50% 0%,#000 40%,transparent 100%);
}
body>*{position:relative;z-index:1}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
svg.ic{display:block;flex:0 0 auto}
.wrap{max-width:520px;margin:0 auto}

header{
  background:var(--glass);backdrop-filter:blur(14px);color:var(--ink);
  padding:13px 16px;display:flex;justify-content:space-between;align-items:center;gap:10px;
  position:sticky;top:0;z-index:5;border-bottom:1px solid var(--line);
}
/* A flex item defaults to min-width:auto, so the name refused to shrink and
   pushed the chevron outside the button. The text column has to be allowed to
   shrink; the chevron must not. */
.idbtn{display:flex;align-items:center;gap:5px;margin-right:auto;text-align:left;
  padding:4px 6px 4px 4px;border-radius:12px;color:var(--ink);
  min-width:0;flex:0 1 auto;overflow:hidden;transition:background .18s}
.idbtn>span:first-child{min-width:0;overflow:hidden}
.idbtn:hover,.idbtn:active{background:var(--surf2)}
.idbtn #idChev{color:var(--v3);display:flex;flex:0 0 auto}
.shop{font-size:16px;font-weight:700;letter-spacing:-.2px;display:block;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.sub{font-size:11.5px;color:var(--mut);display:block;white-space:nowrap;
  overflow:hidden;text-overflow:ellipsis;max-width:100%}
.who{font-size:11px;color:var(--mut2);display:block}
.langs{display:flex;gap:2px;background:var(--surf2);border:1px solid var(--line);
  padding:3px;border-radius:99px;flex:0 0 auto}
.langs button{padding:6px 9px;border-radius:99px;font-size:12px;color:var(--mut)}
.langs button.on{background:var(--grad);color:#fff;font-weight:700}
.theme-btn{
  width:31px;height:31px;border-radius:50%;flex:0 0 auto;margin-left:4px;
  background:var(--surf2);border:1px solid var(--line);color:var(--mut);
  display:grid;place-items:center;transition:.18s}
.theme-btn:hover{color:var(--v3);border-color:var(--line2)}
.langs button{padding:6px 8px}
.acct-btn{
  width:36px;height:36px;border-radius:50%;flex:0 0 auto;margin-left:10px;
  background:var(--surf2);border:1px solid var(--line2);color:var(--v3);
  font-weight:800;font-size:14px;display:grid;place-items:center;transition:.18s;
}
.acct-btn:active{background:var(--surf3);transform:scale(.94)}
main{padding:14px}

/* Counter Mode - the differentiator, so it gets the brightest treatment */
.counter{
  display:flex;align-items:center;gap:13px;padding:15px;border-radius:var(--r);
  background:var(--surf);border:1px solid var(--line);margin-bottom:12px;
  transition:border-color .25s,background .25s;
}
.counter.on{border-color:rgba(168,85,247,.55);background:linear-gradient(135deg,rgba(168,85,247,.12),rgba(99,102,241,.07))}
.counter .glyph{color:var(--mut)}
.counter.on .glyph{color:var(--v3)}
.counter .txt{flex:1;min-width:0}
.counter .txt b{display:block;font-size:15px}
.counter .txt span{font-size:12px;color:var(--mut)}
.sw{width:50px;height:29px;border-radius:99px;background:var(--surf3);border:1px solid var(--line2);position:relative;flex:0 0 auto}
.sw i{position:absolute;top:3px;left:3px;width:21px;height:21px;border-radius:50%;background:var(--mut);transition:.2s}
.counter.on .sw{background:var(--grad);border-color:transparent}
.counter.on .sw i{left:24px;background:#fff}
.live-dot{width:9px;height:9px;border-radius:50%;background:var(--out);animation:blink 1.1s infinite;flex:0 0 auto}
@keyframes blink{50%{opacity:.25}}
.heard{font-size:13px;color:var(--mut);font-style:italic;padding:0 4px 10px;min-height:20px}

.banner{
  display:flex;align-items:center;gap:9px;background:rgba(251,191,36,.09);
  border:1px solid rgba(251,191,36,.28);color:#fcd34d;padding:12px 14px;
  border-radius:var(--r);font-weight:600;margin-bottom:12px;font-size:14.5px;
}
input.search{
  width:100%;padding:13px 15px;border-radius:13px;border:1px solid var(--line);
  background:var(--surf);color:var(--ink);font-size:16px;margin-bottom:12px;outline:none;transition:.18s;
}
input.search::placeholder{color:var(--mut2)}
input.search:focus{border-color:var(--v1);box-shadow:0 0 0 3px rgba(168,85,247,.16)}

.list{display:flex;flex-direction:column;gap:9px}
.row{
  display:flex;justify-content:space-between;align-items:center;gap:10px;width:100%;text-align:left;
  background:var(--surf);border:1px solid var(--line);border-left:3px solid var(--ok);
  border-radius:var(--r);padding:14px;color:var(--ink);transition:border-color .2s,transform .2s,background .2s;
}
.row:hover{background:var(--surf2);transform:translateX(2px)}
.row.low{border-left-color:var(--low)}.row.out{border-left-color:var(--out)}
.nm{font-size:16.5px;font-weight:600;min-width:0}
.nm span{display:block;font-size:11.5px;color:var(--mut2);font-weight:400}
.qt{text-align:right;white-space:nowrap}
.qt b{font-size:21px;font-variant-numeric:tabular-nums}
.qt em{font-size:12.5px;color:var(--mut);font-style:normal;margin-left:2px}
.pill{
  display:inline-flex;align-items:center;gap:4px;white-space:nowrap;margin-top:4px;padding:3px 9px;border-radius:99px;
  font-size:10.5px;font-weight:700;background:rgba(52,211,153,.13);color:var(--ok);
  border:1px solid rgba(52,211,153,.25);
}
.pill.low{background:rgba(251,191,36,.13);color:var(--low);border-color:rgba(251,191,36,.25)}
.pill.out{background:rgba(248,113,113,.13);color:var(--out);border-color:rgba(248,113,113,.25)}
.sugg{text-align:right;font-size:11.5px;color:var(--mut)}
.sugg b{display:block;font-size:18px;color:var(--v3);font-variant-numeric:tabular-nums}
.empty{display:flex;flex-direction:column;align-items:center;gap:10px;padding:54px 20px;color:var(--mut)}

/* pending tray: goods in on the left, goods out on the right */
.tray{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px;align-items:start}
.col h4{
  margin:0 0 7px;font-size:11.5px;font-weight:700;padding:7px 4px;border-radius:99px;
  display:flex;align-items:center;justify-content:center;gap:5px;white-space:nowrap;
}
.col.in h4{background:rgba(52,211,153,.12);color:var(--ok);border:1px solid rgba(52,211,153,.24)}
.col.out h4{background:rgba(248,113,113,.12);color:var(--out);border:1px solid rgba(248,113,113,.24)}
.col .prop{padding:11px;margin-bottom:8px}
.col .prop .quote{font-size:11px;margin-bottom:6px}
.col .step{gap:6px;margin:8px 0}
.col .step button{width:33px;height:33px;font-size:18px}
.col .qv{min-width:44px}.col .qv b{font-size:22px}.col .qv em{font-size:11px}
.col .chips{gap:5px;margin-top:6px}
.col .chips button{padding:6px 9px;font-size:11.5px}
.col .acts{gap:6px;margin-top:9px}
.col .btn{padding:9px 4px;font-size:12.5px}
.col .search{padding:9px 11px;font-size:14px;margin-bottom:8px}
.none{text-align:center;color:var(--mut2);padding:18px;font-size:13px;border:1px dashed var(--line2);border-radius:var(--r)}

/* proposal cards */
.prop{background:var(--surf);border:1px solid var(--line);border-left:3px solid var(--v1);
      border-radius:var(--r);padding:14px;margin-bottom:9px}
.prop.unsure{border-left-color:var(--low);background:rgba(251,191,36,.05)}
.quote{font-size:12.5px;color:var(--mut2);font-style:italic;margin:0 0 10px}
.score{float:right;font-size:10.5px;font-weight:700;padding:3px 8px;border-radius:99px;
  background:rgba(52,211,153,.13);color:var(--ok);border:1px solid rgba(52,211,153,.25)}
.score.w{background:rgba(251,191,36,.13);color:var(--low);border-color:rgba(251,191,36,.25)}
.step{display:flex;align-items:center;gap:12px;justify-content:center;margin:10px 0}
.step button{width:44px;height:44px;border-radius:50%;background:var(--surf2);
  border:1px solid var(--line2);font-size:23px;font-weight:600;color:var(--ink);transition:.15s}
.step button:active{background:var(--surf3);transform:scale(.92)}
.qv{min-width:104px;text-align:center}
.qv b{font-size:30px;display:block;line-height:1;font-variant-numeric:tabular-nums}
.qv em{font-size:12px;color:var(--mut);font-style:normal;display:inline-flex;align-items:center;gap:4px}
.chips{display:flex;gap:7px;flex-wrap:wrap;margin-top:8px}
.chips button{padding:9px 14px;border-radius:99px;border:1px solid var(--line2);
  background:var(--surf2);color:var(--ink);font-size:13.5px;transition:.15s}
.chips button:hover{border-color:var(--v1)}
.chips button.on{background:var(--grad);color:#fff;border-color:transparent;font-weight:600}
.acts{display:flex;gap:9px;margin-top:12px}
.btn{flex:1;padding:14px;border-radius:13px;font-size:15.5px;font-weight:700;
  background:var(--surf2);border:1px solid var(--line2);color:var(--ink);transition:.15s}
.btn:hover{border-color:var(--line2);background:var(--surf3)}
.btn.go{background:var(--grad);color:#fff;border-color:transparent;box-shadow:0 6px 18px rgba(124,58,237,.3)}
.btn.ghost{background:var(--surf2)}
.btn.wide{width:100%;margin-top:10px}
.btn:disabled{opacity:.4}

nav{position:fixed;bottom:0;left:0;right:0;max-width:520px;margin:0 auto;z-index:6;
  background:var(--glass);backdrop-filter:blur(14px);border-top:1px solid var(--line);
  display:flex;align-items:center;justify-content:space-around;
  padding:8px 0 calc(8px + env(safe-area-inset-bottom))}
nav>button{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;
  font-size:11.5px;color:var(--mut2);padding:6px 0;position:relative;transition:color .18s}
nav>button.on{color:var(--v3);font-weight:700}
nav>button.mic{flex:0 0 62px;width:62px;height:62px;border-radius:50%;background:var(--grad);
  color:#fff;margin-top:-26px;padding:0;display:grid;place-items:center;
  box-shadow:0 8px 24px rgba(124,58,237,.45)}
nav>button.mic:active{transform:scale(.94)}
.dot{position:absolute;top:0;right:22%;background:var(--out);color:#fff;font-style:normal;
  font-size:10px;font-weight:700;min-width:18px;height:18px;border-radius:9px;
  display:grid;place-items:center;padding:0 4px}

.sheet{position:fixed;inset:0;background:var(--scrim);backdrop-filter:blur(3px);
  z-index:20;display:flex;align-items:flex-end}
.card{background:var(--surf);border-top:1px solid var(--line2);width:100%;max-width:520px;
  margin:0 auto;border-radius:22px 22px 0 0;color:var(--ink);
  padding:16px 18px calc(104px + env(safe-area-inset-bottom));max-height:88vh;overflow:auto;
  animation:up .24s cubic-bezier(.22,1,.36,1)}
@keyframes up{from{transform:translateY(100%)}to{transform:translateY(0)}}
.grab{width:38px;height:4px;background:var(--line2);border-radius:2px;margin:0 auto 14px}
.big{background:linear-gradient(135deg,rgba(168,85,247,.14),rgba(99,102,241,.08));
  border:1px solid var(--line2);border-radius:var(--r);padding:18px;text-align:center}
.big b{font-size:40px;font-variant-numeric:tabular-nums}
.big em{font-size:16px;color:var(--mut);font-style:normal}
.facts{display:flex;flex-direction:column;gap:1px;background:var(--line);
  border-radius:var(--r);overflow:hidden;margin-top:12px;border:1px solid var(--line)}
.facts div{display:flex;justify-content:space-between;background:var(--surf2);padding:12px 14px;font-size:14px}
.facts span{color:var(--mut)}
.h{border:1px solid var(--line);background:var(--surf2);border-radius:12px;
  padding:10px 12px;margin-bottom:7px;font-size:13.5px}
.h b{color:var(--ok);font-variant-numeric:tabular-nums}.h.neg b{color:var(--out)}
.h .quote{margin:0;font-size:12px}
/* Account menu: anchored under the header instead of a bottom sheet, which
   collided with the fixed bottom nav and hid sign-out. */
.menuwrap{position:fixed;inset:0;z-index:25}
.menu{position:absolute;right:12px;width:min(286px,calc(100vw - 24px));
  background:var(--surf);border:1px solid var(--line2);border-radius:16px;
  box-shadow:var(--shadow);overflow:hidden;transform-origin:top right;
  animation:pop .16s cubic-bezier(.22,1,.36,1)}
@keyframes pop{from{opacity:0;transform:scale(.94) translateY(-8px)}to{opacity:1;transform:none}}
.menu .mhead{padding:14px}
.menu .mhead b{display:block;font-size:15.5px;line-height:1.3}
.menu .mhead span{font-size:12px;color:var(--mut);word-break:break-all;display:block;margin-top:2px}
.menu .mrow{display:flex;justify-content:space-between;gap:10px;padding:9px 14px;font-size:13.5px}
.menu .mrow span{color:var(--mut)}
.menu .mrow b{font-variant-numeric:tabular-nums}
.menu .msep{height:1px;background:var(--line);margin:6px 0}
.menu .mact{display:flex;align-items:center;gap:10px;width:100%;text-align:left;
  padding:13px 14px;font-size:14.5px;color:var(--ink);transition:background .15s}
.menu .mact:hover,.menu .mact:active{background:var(--surf2)}
.menu .mact.dz{color:var(--out)}
.arow{display:flex;justify-content:space-between;padding:13px 2px;border-bottom:1px solid var(--line);font-size:15px}
.arow span{color:var(--mut)}
.danger{width:100%;margin-top:18px;padding:15px;border-radius:13px;
  background:rgba(248,113,113,.12);border:1px solid rgba(248,113,113,.3);
  color:var(--out);font-weight:700;font-size:15.5px;
  display:flex;align-items:center;justify-content:center;gap:8px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:106px;z-index:30;
  background:var(--surf3);border:1px solid var(--line2);color:var(--ink);
  padding:13px 18px;border-radius:13px;font-size:14.5px;
  width:calc(100% - 32px);max-width:460px;box-shadow:var(--shadow);
  animation:up .2s ease-out}

.mic-state{text-align:center;padding:14px 0 6px}
.mic-state h2{margin:16px 0 6px;font-size:20px}
.pulse{width:74px;height:74px;margin:0 auto;border-radius:50%;display:grid;place-items:center;
  color:#fff;background:var(--grad);animation:breathe 1.5s ease-in-out infinite}
@keyframes breathe{0%,100%{transform:scale(1);box-shadow:0 0 0 0 rgba(168,85,247,.5)}
  50%{transform:scale(1.07);box-shadow:0 0 0 18px rgba(168,85,247,0)}}
.spin{width:64px;height:64px;margin:0 auto;border-radius:50%;display:grid;place-items:center;
  color:var(--v3);animation:sp 1.4s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.live{color:var(--mut);font-size:16px;min-height:26px}
.warn{color:var(--low);font-weight:600;display:flex;align-items:center;justify-content:center;gap:7px}
.confirm{display:flex;flex-direction:column;gap:12px}
.cfield{display:flex;justify-content:space-between;align-items:center;font-size:20px;font-weight:700;
  background:var(--surf2);border:1px solid var(--line2);border-radius:var(--r);padding:15px}
.maybe small{color:var(--mut);font-size:12.5px;display:block;margin-bottom:7px}

/* ── motion ───────────────────────────────────────────────────────────── */
.rv{opacity:0;transform:translateY(20px);
  transition:opacity .6s cubic-bezier(.22,1,.36,1),transform .6s cubic-bezier(.22,1,.36,1)}
.rv.in{opacity:1;transform:none}
.rv.d1{transition-delay:.07s}.rv.d2{transition-delay:.14s}.rv.d3{transition-delay:.21s}
.rv.d4{transition-delay:.28s}.rv.d5{transition-delay:.35s}
@media (prefers-reduced-motion: reduce){
  .rv,.rv.in{opacity:1;transform:none;transition:none}
  *,*::before,*::after{animation-duration:.001ms!important;animation-iteration-count:1!important;
    transition-duration:.001ms!important;scroll-behavior:auto!important}
}

/* ── landing ──────────────────────────────────────────────────────────── */
body.land .wrap, body.land nav, body.land #auth{display:none}
#landing{display:none}
body.land #landing{display:block;position:fixed;inset:0;overflow-y:auto;z-index:35;background:var(--bg)}
.lnav{position:sticky;top:0;z-index:3;display:flex;align-items:center;gap:6px;padding:11px 12px;
  background:var(--glass);backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.lnav .lg{display:flex;align-items:center;gap:7px;font-weight:800;font-size:15px;
  letter-spacing:-.3px;margin-right:auto;white-space:nowrap}
.lnav .mini{display:flex;gap:2px;background:var(--surf2);border:1px solid var(--line);padding:3px;border-radius:99px}
.lnav .mini button{padding:5px 7px;border-radius:99px;font-size:11.5px;color:var(--mut)}
.lnav .mini button.on{background:var(--grad);color:#fff;font-weight:700}
.lnav .go{background:var(--grad);color:#fff;padding:9px 13px;border-radius:99px;
  font-size:12.5px;font-weight:700;white-space:nowrap;flex:0 0 auto;
  box-shadow:0 4px 14px rgba(124,58,237,.35)}

.hero{position:relative;overflow:hidden;padding:44px 22px 56px;text-align:center}
.hero::before{content:"";position:absolute;left:50%;top:-140px;width:520px;height:520px;
  transform:translateX(-50%);pointer-events:none;
  background:radial-gradient(circle,rgba(168,85,247,.28),transparent 62%);
  animation:drift 13s ease-in-out infinite}
@keyframes drift{0%,100%{transform:translateX(-50%) scale(1)}50%{transform:translateX(-46%) scale(1.16)}}
.badge{position:relative;display:inline-flex;align-items:center;gap:7px;padding:6px 14px 6px 8px;
  border-radius:99px;background:rgba(168,85,247,.12);border:1px solid rgba(168,85,247,.35);
  color:var(--v3);font-size:12px;font-weight:600;margin-bottom:18px}
.badge i{font-style:normal;background:var(--grad);color:#fff;padding:2px 8px;border-radius:99px;font-size:10px;font-weight:800;letter-spacing:.05em}
.badge{max-width:calc(100% - 20px)}
.hero h1{position:relative;margin:0 0 12px;font-size:36px;line-height:1.12;letter-spacing:-1.2px;font-weight:800}
.hero h1 span{display:block;background:linear-gradient(100deg,#c084fc 0%,#818cf8 55%,#22d3ee 100%);
  -webkit-background-clip:text;background-clip:text;color:transparent}
.hero p{position:relative;margin:0 auto 26px;max-width:340px;font-size:15px;color:var(--mut);line-height:1.6}
.cta{position:relative;display:inline-flex;gap:10px;flex-wrap:wrap;justify-content:center}
.cta button{padding:14px 26px;border-radius:99px;font-size:15.5px;font-weight:700;
  display:inline-flex;align-items:center;gap:8px;transition:transform .16s,box-shadow .16s}
.cta .p{background:var(--grad);color:#fff;box-shadow:0 8px 24px rgba(124,58,237,.42)}
.cta .s{background:var(--surf2);color:var(--ink);border:1px solid var(--line2)}
.cta button:active{transform:scale(.96)}

/* the mark's rings pulse outward: the product is "it is listening" */
.waves{position:relative;height:78px;display:grid;place-items:center;margin-bottom:20px}
.waves i{position:absolute;width:30px;height:30px;border-radius:50%;
  border:1.5px solid var(--v1);opacity:0;animation:ring 2.8s ease-out infinite}
.waves i:nth-child(2){animation-delay:.93s}.waves i:nth-child(3){animation-delay:1.86s}
@keyframes ring{0%{transform:scale(1);opacity:.9}100%{transform:scale(3.1);opacity:0}}
.waves b{position:relative;width:46px;height:46px;border-radius:50%;background:var(--grad);
  display:grid;place-items:center;color:#fff;box-shadow:0 0 30px rgba(168,85,247,.55)}

.sect{padding:34px 18px;max-width:560px;margin:0 auto}
.sect h2{font-size:11.5px;font-weight:800;letter-spacing:.16em;text-transform:uppercase;
  color:var(--v3);margin:0 0 18px;text-align:center}
.cards{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.fcard{background:var(--surf);border:1px solid var(--line);border-radius:18px;padding:16px;
  transition:transform .22s cubic-bezier(.22,1,.36,1),border-color .22s,box-shadow .22s}
.fcard:hover{transform:translateY(-4px);border-color:rgba(168,85,247,.45);
  box-shadow:0 14px 34px rgba(124,58,237,.18)}
.fcard .ico{width:38px;height:38px;border-radius:11px;display:grid;place-items:center;
  color:var(--v3);background:rgba(168,85,247,.11);border:1px solid rgba(168,85,247,.22);margin-bottom:11px}
.fcard b{display:block;font-size:14.5px;margin-bottom:5px}
.fcard span{font-size:12.5px;color:var(--mut);line-height:1.55}
.steps{display:flex;flex-direction:column;gap:10px}
.step-row{display:flex;align-items:center;gap:14px;background:var(--surf);
  border:1px solid var(--line);border-radius:16px;padding:15px;transition:border-color .2s}
.step-row:hover{border-color:rgba(168,85,247,.4)}
.step-row em{flex:0 0 32px;height:32px;border-radius:50%;background:var(--grad);color:#fff;
  display:grid;place-items:center;font-style:normal;font-weight:800;font-size:14px}
.step-row span{font-size:14.5px;font-weight:600}
.lfoot{text-align:center;padding:8px 18px 50px}

/* ── sign in / register ───────────────────────────────────────────────── */
body.out .wrap, body.out nav{display:none}
#auth{display:none}
body.out #auth{display:block;position:fixed;inset:0;overflow:auto;z-index:40;background:var(--bg)}
body.out #auth::before{content:"";position:fixed;left:50%;top:-180px;width:560px;height:560px;
  transform:translateX(-50%);pointer-events:none;
  background:radial-gradient(circle,rgba(168,85,247,.22),transparent 62%)}
.atop{position:absolute;top:calc(14px + env(safe-area-inset-top));left:14px;right:14px;
  display:flex;justify-content:flex-start;z-index:2}
.atop .lang-toggle{display:flex;gap:3px;background:var(--surf2);border:1px solid var(--line);
  padding:4px;border-radius:99px}
.atop .lang-toggle button{padding:8px 13px;border-radius:99px;color:var(--mut);font-size:12.5px}
.atop .lang-toggle button.on{background:var(--grad);color:#fff;font-weight:700}
.aw{position:relative;max-width:420px;margin:0 auto;
  padding:78px 22px calc(28px + env(safe-area-inset-bottom))}
.brand{text-align:center;margin-bottom:24px}
.brand h1{margin:14px 0 5px;font-size:30px;letter-spacing:-.8px;font-weight:800}
.brand p{margin:0;font-size:13.5px;color:var(--mut)}
.apick{display:flex;gap:4px;background:var(--surf2);border:1px solid var(--line);
  padding:4px;border-radius:99px;margin-bottom:18px}
.apick button{flex:1;padding:11px;border-radius:99px;color:var(--mut);font-size:14px}
.apick button.on{background:var(--grad);color:#fff;font-weight:700}
.acard{background:var(--surf);border:1px solid var(--line);border-radius:20px;
  padding:22px 20px;box-shadow:var(--shadow)}
.fld{margin-bottom:14px}
.fld label{display:block;font-size:12.5px;font-weight:600;color:var(--mut);margin-bottom:6px}
.fld input{width:100%;padding:14px;border-radius:12px;border:1px solid var(--line2);
  background:var(--surf2);color:var(--ink);font-size:16.5px;outline:none;transition:.18s}
.fld input::placeholder{color:var(--mut2)}
.fld input:focus{border-color:var(--v1);box-shadow:0 0 0 3px rgba(168,85,247,.16)}
.fld input.pin{letter-spacing:.5em;text-align:center;font-size:21px}
.err{display:flex;align-items:center;gap:8px;background:rgba(248,113,113,.12);
  border:1px solid rgba(248,113,113,.3);color:#fca5a5;padding:11px 13px;
  border-radius:12px;font-size:13.5px;margin-bottom:14px;font-weight:600}
.big-btn{width:100%;padding:16px;border-radius:13px;background:var(--grad);color:#fff;
  font-size:16px;font-weight:700;box-shadow:0 8px 22px rgba(124,58,237,.38);transition:transform .15s}
.big-btn:active{transform:scale(.98)}
.big-btn:disabled{opacity:.45}
.orline{display:flex;align-items:center;gap:10px;margin:16px 0;color:var(--mut2);font-size:12.5px}
.orline::before,.orline::after{content:"";flex:1;height:1px;background:var(--line2)}
#gbtn{display:flex;justify-content:center;min-height:44px}
.ghint{font-size:11.5px;color:var(--mut2);text-align:center;margin-top:10px;line-height:1.55}
</style>
</head>

      answer:(n,t,b)=>`You have ${t} ${b} of ${n}.`, lowMsg:c=>`${c} items running low`, tagline:'Stock, by listening to your shop',signIn:'Sign in',newAcc:'New account',phone:'Mobile number',pin:'4-digit PIN',pin2:'PIN again',shopN:'Shop name',ownerN:'Your name',enter:'Enter',create:'Create account',logout:'Sign out',pinBad:'The two PINs do not match',welcome:n=>`Hello, ${n}`,chooseLang:'Choose language',orLine:'or',ghint:'If Google does not open, allow popups - or use the phone number above',heroA:'Your shop talks.',heroB:'It listens.',heroSub:'No commands to learn. Leave the phone on the counter and ordinary conversation becomes your stock book.',start:'Get started',already:'I have an account',f1t:'Counter Mode',f1d:'Picks up stock from what you and the customer already say',f2t:'Your language',f2d:'Hindi, Telugu, English — mixed in one sentence',f3t:'Bori, peti, dozen',f3d:'Speak in the units you actually buy in',f4t:'Never writes a guess',f4d:'It proposes; stock changes only when you agree',f5t:'Learns as you go',f5d:'Correct it once and it knows that word forever',f6t:'What to order',f6d:'Low stock, counted in sacks and cartons',s1:'Put the phone on the counter',s2:'Talk to customers as usual',s3:'One tap to approve',howT:'How it works',featT:'What it does',account:'Account',itemsWord:'items',themeLbl:'Switch theme',signOutQ:'Sign out?',nameShop:'Name your shop',save:'Save', mismatch:'Count disagrees'},
};
const LOCALE = {hi:'hi-IN', te:'te-IN', en:'en-IN'};

// ─── theme: one attribute on <html>, everything else is token swaps ───
let theme = localStorage.getItem('sb_theme')
  || (matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
function applyTheme(){
  document.documentElement.dataset.theme = theme;
  document.querySelectorAll('.theme-btn').forEach(b => b.innerHTML = icon(theme === 'dark' ? 'sun' : 'moon', 17));
}
function toggleTheme(){
  theme = theme === 'dark' ? 'light' : 'dark';
  try{ localStorage.setItem('sb_theme', theme); }catch{}
  applyTheme();
}

// ─── state ───
let lang='hi', tab='stock', items=[], alerts=[], props=[], counterOn=false, nextId=1;
const t = () => T[lang];
const nameOf = i => lang==='hi' ? i.name_hi : lang==='te' ? i.name_te : i.name;
let token = localStorage.getItem('sb_token') || '';
let shopName = localStorage.getItem('sb_shop') || '';
let ownerName = localStorage.getItem('sb_owner') || '';

async function api(path, body){
  const r = await fetch(path, {
    method: body ? 'POST' : 'GET',
    headers: {...(body ? {'Content-Type':'application/json'} : {}),
              ...(token ? {Authorization: 'Bearer ' + token} : {})},
    body: body ? JSON.stringify(body) : undefined,
  });
  // A rejected token means sign in again - not an error worth showing. But a
  // 401 from /login is a WRONG PIN, and telling that user "signed out" instead
  // of "wrong PIN" is nonsense, so those two are left to report themselves.
  const isAuthCall = path === '/login' || path === '/register';
  if(r.status === 401 && !isAuthCall){ signOut(); throw new Error('signed out'); }
  const data = await r.json().catch(() => ({}));
  if(!r.ok) throw new Error(data.detail || 'something went wrong');
  return data;
}

// ─── speech ───
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
let counterRec = null;

function say(text){                       // spoken reply, one line, no dependency
  if(!window.speechSynthesis) return;
  const u = new SpeechSynthesisUtterance(text); u.lang = LOCALE[lang]; u.rate = .95;
  speechSynthesis.cancel(); speechSynthesis.speak(u);
}

/* COUNTER MODE - the idea of the product.
   Chrome ends a continuous session on long silence, so onend restarts it.
   Without that the app goes quietly deaf after the first lull at the counter. */
function toggleCounter(){
  if(!SR){ alert(t().type); return; }
  counterOn = !counterOn;
  if(!counterOn){ counterRec.onend = null; counterRec.stop(); counterRec = null; render(); return; }

  counterRec = new SR();
  counterRec.lang = LOCALE[lang];
  counterRec.continuous = true;
  counterRec.interimResults = true;

  counterRec.onresult = e => {
    let live = '';
    for(let i=e.resultIndex; i<e.results.length; i++){
      const txt = e.results[i][0].transcript;
      if(e.results[i].isFinal) propose(txt, 'counter'); else live += txt;
    }
    const el = document.getElementById('heard'); if(el) el.textContent = live;
  };
  counterRec.onend = () => { if(counterOn) counterRec.start(); };   // keep listening
  counterRec.start();
  render();
}

/* COMMAND MODE - the reliable floor. One deliberate sentence.
   NOTE: this cannot be called command() - Chrome buttons now have their own
   .command property, which shadows a global of that name inside onclick. */
function micEntry(){
  if(!SR) return manual();
  const rec = new SR(); rec.lang = LOCALE[lang]; rec.interimResults = true;
  // On failure the browser fires onerror AND THEN onend. Without this flag,
  // onend closes the fallback sheet that onerror just opened.
  let final = '', failed = false;
  sheet(`<div style="text-align:center;padding:20px 0">
           <div class="pulse">${icon('mic',30)}</div><h2>${t().speak}</h2>
           <p class="quote" id="live">…</p></div>`);
  rec.onresult = e => {
    let live='';
    for(let i=e.resultIndex;i<e.results.length;i++){
      const x = e.results[i][0].transcript;
      if(e.results[i].isFinal) final += x; else live += x;
    }
    document.getElementById('live').textContent = final + live;
  };
  rec.onend = () => { if(failed) return; closeSheet(); if(final.trim()) propose(final.trim(), 'command'); };
  rec.onerror = () => { failed = true; closeSheet(); manual(); };
  rec.start();
}

function manual(){                        // works with no microphone at all
  sheet(`<h3>${t().type}</h3>
    <input class="search" id="mtext" placeholder="बीस किलो चावल आया" autofocus>
    <button class="btn go wide" onclick="const v=document.getElementById('mtext').value;
      closeSheet(); if(v.trim()) propose(v.trim(),'manual')">${t().ok}</button>`);
}

// ─── the loop: text -> /parse -> proposals ───
async function propose(text, source){
  const r = await api('/parse', {text, lang, mode: source==='counter'?'counter':'command'});
  for(const m of r.moves){
    if(m.action === 'query_item'){ say(t().answer(nameOf(m.item), m.item.stock, m.item.base_unit)); continue; }
    if(m.action === 'query_low'){ say(t().lowMsg(alerts.length)); go('alerts'); continue; }
    m.id = nextId++; m.source = source;
    // Only a real stock move derives its direction from the action. unknown_item
    // and need_item already carry the direction the parser worked out from the
    // verb, and overwriting it put "sab NIKAL do" in the incoming column.
    if(m.action === 'stock_in' || m.action === 'stock_out')
      m.direction = m.action === 'stock_out' ? 'out' : 'in';
    props.unshift(m);
  }
  render();
}

async function accept(id){
  const m = props.find(p => p.id === id); if(!m) return;
  const r = await api('/commit', {item_id:m.item.id, qty:m.qty, unit:m.unit, direction:m.direction,
                                  transcript:m.transcript, lang, confidence:m.confidence, source:m.source});
  props = props.filter(p => p.id !== id);
  const msg = (m.direction==='out' ? t().removed : t().added)(m.qty, m.unit, nameOf(m.item), r.new_total, r.base_unit);
  toast(msg); say(msg);
  await load();
}
const reject = id => { props = props.filter(p => p.id !== id); render(); };
async function acceptAll(){ for(const p of props.filter(p=>p.sure)) await accept(p.id); }

function edit(id, patch){ Object.assign(props.find(p=>p.id===id), patch); render(); }

// ─── rendering ───
async function load(){ [items, alerts] = await Promise.all([api('/stock'), api('/alerts')]); render(); }

function render(){
  document.getElementById('shopName').textContent = shopName || 'SunoBolo';
  const ab = document.getElementById('acctBtn');
  ab.textContent = (ownerName || '?').trim().charAt(0).toUpperCase();
  ab.title = t().account;
  document.getElementById('shopSub').innerHTML =
    `${items.length} ${t().stock} <span class="who">${ownerName}</span>`;
  document.getElementById('lblStock').textContent = t().stock;
  document.querySelector('nav .mic').innerHTML = icon('mic', 26);
  document.getElementById('icStock').innerHTML = icon('box', 21);
  document.getElementById('icAlerts').innerHTML = icon('bell', 21);
  document.getElementById('idChev').innerHTML = icon('chev', 16);
  document.getElementById('lblAlerts').textContent = t().alerts;
  document.getElementById('tabStock').className = tab==='stock' ? 'on':'';
  document.getElementById('tabAlerts').className = tab==='alerts' ? 'on':'';
  const d = document.getElementById('alertDot'); d.hidden = !alerts.length; d.textContent = alerts.length;
  document.getElementById('langs').innerHTML = ['hi','te','en'].map(l =>
    `<button class="${l===lang?'on':''}" onclick="setLang('${l}')">${({hi:'हिंदी',te:'తెలుగు',en:'EN'})[l]}</button>`).join('')
;

  let h = `<div class="counter ${counterOn?'on':''}" onclick="toggleCounter()">
      ${counterOn ? '<span class="live-dot"></span>' : `<span class="glyph">${icon('ear',23)}</span>`}
      <div class="txt"><b>${t().counter}</b><span>${counterOn ? t().counterOn : t().counterOff}</span></div>
      <div class="sw"><i></i></div></div>`;
  if(counterOn) h += `<div class="heard" id="heard"></div>`;

  if(props.length){
    h += `<div class="banner" style="display:flex;justify-content:space-between;align-items:center">
            <span style="display:inline-flex;align-items:center;gap:7px">${icon('list',17)} ${t().pending} (${props.length})</span>
            ${props.some(p=>p.sure) ? `<button class="btn go" style="flex:0 0 auto;padding:9px 14px;
               font-size:14px;white-space:nowrap" onclick="acceptAll()">${t().acceptAll}</button>` : ''}</div>`;
    // Split by direction. Goods coming in and goods going out are different
    // jobs, and mixing them in one list made a batch impossible to scan.
    const side = (dir, cls) => {
      const mine = props.filter(p => p.direction === dir);
      return `<div class="col ${cls}"><h4>${dir==='in' ? icon('down',15)+t().inCol : icon('up',15)+t().outCol} (${mine.length})</h4>
        ${mine.map(card).join('') || `<div class="none">—</div>`}</div>`;
    };
    h += `<div class="tray">${side('in','in')}${side('out','out')}</div>`;
  }

  if(tab === 'stock'){
    if(alerts.length) h += `<div class="banner">${icon('alert',17)}<span>${t().lowMsg(alerts.length)}</span></div>`;
    const rank = {out:0, low:1, ok:2};
    let n = 0;
    h += '<div class="list">' + [...items].sort((a,b)=>rank[a.status]-rank[b.status]).map(i =>
      `<button class="row ${i.status} rv d${Math.min(n++,5)}" onclick="detail(${i.id})">
         <div class="nm">${nameOf(i)}<span>${i.name}</span></div>
         <div class="qt"><b>${i.stock}</b> <em>${i.base_unit}</em>
           <div class="pill ${i.status}">${i.mismatch ? icon('alert',11)+t().mismatch
             : i.status==='out'?t().out : i.status==='low'?t().low : t().ok}</div></div>
       </button>`).join('') + '</div>';
  } else {
    h += alerts.length ? '<div class="list">' + alerts.map(a =>
      `<button class="row ${a.status}" onclick="detail(${a.id})">
         <div class="nm">${nameOf(a)}<span>${a.stock} ${a.base_unit}</span></div>
         <div class="sugg">${t().order}<b>${a.order_qty} ${a.order_unit}</b>${a.need} ${a.base_unit}</div>
       </button>`).join('') + '</div>' : `<div class="empty">${icon('check',30)}<span>${t().none}</span></div>`;
  }
  document.getElementById('main').innerHTML = h;
  observeReveals();
  applyTheme();
}

/* A proposal card. Everything on it is correctable with a tap - that is both
   the correction feature and the safety net for a fuzzy match being wrong. */
function card(m){
  if(m.action === 'unknown_item') return pickCard(m, icon('help',19)+' '+m.heard, t().unknown, true);
  if(m.action === 'need_item')    return pickCard(m, icon('box',19)+' '+(m.all ? t().allOf : m.qty), t().whichItem, false);
  const units = [m.item.base_unit, ...Object.keys(m.item.packs)];
  return `<div class="prop ${m.sure?'':'unsure'}">
    <span class="score ${m.sure?'':'w'}">${Math.round(m.confidence)}%</span>
    <p class="quote">“${m.transcript}”</p>
    <div style="font-size:20px;font-weight:700">${nameOf(m.item)}</div>
    ${!m.sure && m.candidates.length ? `<div style="font-size:12px;color:var(--mut);margin-top:6px">${t().maybe}</div>
      <div class="chips">${m.candidates.map(c=>
         `<button onclick="pickItem(${m.id},${c.id})">${nameOf(c)}</button>`).join('')}
         <button onclick="openSearch(${m.id})">${icon('help',14)} ${t().search}</button></div>`:''}
    <div class="step">
      <button onclick="edit(${m.id},{qty:Math.max(.5,${m.qty}-1)})">−</button>
      <div class="qv" onclick="askQty(${m.id})"><b>${m.qty}</b><em>${m.unit} ${icon('pencil',12)}</em></div>
      <button onclick="edit(${m.id},{qty:${m.qty}+1})">+</button></div>
    <div class="chips">${units.map(u=>`<button class="${u===m.unit?'on':''}"
       onclick="edit(${m.id},{unit:'${u}'})">${u}</button>`).join('')}</div>
    <div class="chips"><button style="flex:1;display:flex;align-items:center;justify-content:center;
        gap:6px;white-space:nowrap" onclick="edit(${m.id},{direction:'${
        m.direction==='in'?'out':'in'}'})">${icon('swap',14)}${t().swap}</button></div>
    <div class="acts"><button class="btn" onclick="reject(${m.id})">${t().no}</button>
      <button class="btn go" onclick="accept(${m.id})">${t().yes}</button></div></div>`;
}

/* Two different failures, one card.
     unknown_item - we heard a word and stock nothing like it -> offer to ADD it
     need_item    - a clear instruction with no item named ("sab nikal do")
                    -> just ask which item; there is nothing to add.
   Never guess in either case. */
function pickCard(m, title, subtitle, canAdd){
  return `<div class="prop unsure">
    <p class="quote">“${m.transcript}”</p>
    <div style="font-size:18px;font-weight:700">${title}</div>
    <div style="font-size:12px;color:var(--mut);margin:4px 0 2px">${subtitle}</div>
    <input class="search" style="margin-top:9px" placeholder="${t().search}"
           oninput="searchFor(${m.id}, this.value)" onfocus="searchFor(${m.id},'')">
    <div class="chips" id="res${m.id}"></div>
    <div class="acts"><button class="btn" onclick="reject(${m.id})">${t().no}</button>
      ${canAdd ? `<button class="btn go" onclick="addNew(${m.id})">${t().addNew}</button>` : ''}</div></div>`;
}

async function searchFor(id, q){
  const hits = await api('/search?q=' + encodeURIComponent(q));
  const box = document.getElementById('res' + id);
  if(box) box.innerHTML = hits.slice(0, 6).map(i =>
    `<button onclick="pickItem(${id},${i.id})">${nameOf(i)}</button>`).join('');
}

const openSearch = id => { props.find(p=>p.id===id).action = 'unknown_item'; render(); };

/* Correcting a match is also how the app LEARNS. The word that was actually
   said is stored as an alias of the item the owner picked, so the same word
   matches straight away next time. No training, just one more row. */
async function pickItem(id, itemId){
  const m = props.find(p => p.id === id);
  const it = (await api('/stock')).find(x => x.id === itemId);
  if(m.heard){
    const r = await api(`/items/${itemId}/alias`, {word: m.heard});
    if(r.learned) toast(t().learned(m.heard));
  }
  Object.assign(m, {action: m.direction === 'out' ? 'stock_out' : 'stock_in',
    item: it, confidence: 100, sure: true, candidates: [],
    // "sab nikal do" then picking Rice means all the rice actually on the shelf
    qty: (m.all && m.direction === 'out') ? Math.max(0, it.stock) : m.qty,
    unit: (m.all && m.direction === 'out') ? it.base_unit
          : (it.packs[m.unit] ? m.unit : it.base_unit)});
  render();
}

function askQty(id){
  const v = prompt(t().qtyPrompt, props.find(p => p.id === id).qty);
  if(v !== null && !isNaN(parseFloat(v))) edit(id, {qty: parseFloat(v)});
}

function addNew(id){
  const m = props.find(p => p.id === id);
  sheet(`<h3>${t().addNew}</h3>
    <input class="search" id="nname" value="${m.heard}">
    <div class="chips" id="nunit">${['kg','pc','litre'].map((u,i) =>
      `<button class="${i?'':'on'}" onclick="pickUnit(this)">${u}</button>`).join('')}</div>
    <button class="btn go wide" onclick="saveNew(${id})">${t().ok}</button>`);
}
const pickUnit = b => { [...b.parentNode.children].forEach(x => x.className = ''); b.className = 'on'; };

async function saveNew(id){
  const m = props.find(p => p.id === id);
  const name = document.getElementById('nname').value.trim();
  if(!name) return;
  const unit = document.querySelector('#nunit .on').textContent;
  const it = await api('/items', {name, base_unit: unit, heard: m.heard});
  closeSheet();
  await load();
  Object.assign(m, {action: m.direction === 'out' ? 'stock_out' : 'stock_in',
    item: {id: it.id, name: it.name, name_hi: it.name, name_te: it.name,
           base_unit: it.base_unit, packs: {}, stock: 0},
    unit: it.base_unit, confidence: 100, sure: true, candidates: []});
  render();
}

async function detail(id){
  const i = await api('/item/'+id);
  sheet(`<h2 style="margin:4px 0 10px">${nameOf(i)}</h2>
    <div class="big"><b>${i.stock}</b> <em>${i.base_unit}</em></div>
    <div class="facts">
      ${Object.entries(i.packs).map(([u,f])=>`<div><span>1 ${u}</span><b>${f} ${i.base_unit}</b></div>`).join('')}
      <div><span>${t().low}</span><b>${i.reorder_level} ${i.base_unit}</b></div>
      <div><span>₹</span><b>${i.last_price}/${i.base_unit}</b></div></div>
    <h3 style="font-size:14px;color:var(--mut)">${t().history}</h3>
    ${i.history.map(x=>`<div class="h ${x.qty_base<0?'neg':''}">
        <b>${x.qty_base>0?'+':''}${x.qty_base} ${i.base_unit}</b> — “${x.transcript||''}”</div>`).join('')}
    <button class="btn wide" onclick="closeSheet()">${t().ok}</button>`);
}

// ─── small helpers ───
const sheet = html => document.getElementById('sheet').innerHTML =
  `<div class="sheet" onclick="if(event.target===this)closeSheet()"><div class="card">${html}</div></div>`;
const closeSheet = () => document.getElementById('sheet').innerHTML = '';
function toast(msg){
  const d = document.createElement('div'); d.className='toast'; d.textContent=msg;
  document.body.appendChild(d); setTimeout(()=>d.remove(), 4000);
}
const go = x => { tab = x; render(); };
function setLang(l){
  lang = l;
  if(counterOn){ toggleCounter(); toggleCounter(); }   // restart recognition in the new locale
  render();
}

// ─── sign in / register ───────────────────────────────────────────────────
let authMode = 'in';        // 'in' = sign in, 'up' = create account
let authErr = '';

function signOut(){
  token = shopName = ownerName = '';
  ['sb_token','sb_shop','sb_owner'].forEach(k => localStorage.removeItem(k));
  if(counterOn) toggleCounter();   // never keep listening once nobody is signed in
  props = []; items = []; alerts = [];
  authMode = 'in'; authErr = '';   // signing out lands on sign-in, not on register
  showLanding();
}

function signedIn(r){
  token = r.token; shopName = r.shop_name; ownerName = r.owner_name;
  localStorage.setItem('sb_token', token);
  localStorage.setItem('sb_shop', shopName);
  localStorage.setItem('sb_owner', ownerName);
  if(r.lang) lang = r.lang;
  authErr = '';
  document.body.classList.remove('out', 'land');
  document.getElementById('auth').innerHTML = '';
  load();
  toast(t().welcome(ownerName));
}

const MARK = `<svg viewBox="0 0 64 64" width="62" height="62" aria-hidden="true">
  <defs><linearGradient id="gb" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#a855f7"/><stop offset="1" stop-color="#6366f1"/></linearGradient></defs>
  <circle cx="32" cy="32" r="30" fill="url(#gb)"/>
  <circle cx="23" cy="32" r="6" fill="#fff"/>
  <path d="M33 21a15 15 0 0 1 0 22" stroke="#fff" stroke-width="4.5" fill="none" stroke-linecap="round"/>
  <path d="M42 14a24 24 0 0 1 0 36" stroke="#e9d5ff" stroke-width="4.5" fill="none" stroke-linecap="round"/>
</svg>`;

function renderAuth(){
  const up = authMode === 'up';
  const f = (id, label, extra='') =>
    `<div class="fld"><label for="${id}">${label}</label><input id="${id}" ${extra}></div>`;
  document.getElementById('auth').innerHTML = `
    <div class="atop"><div class="lang-toggle">${['hi','te','en'].map(l =>
      `<button class="${l===lang?'on':''}" onclick="setLang('${l}');renderAuth()">${
        ({hi:'हिंदी',te:'తెలుగు',en:'EN'})[l]}</button>`).join('')}</div>
      <button class="theme-btn" onclick="toggleTheme()" aria-label="theme"
        style="margin-left:8px"></button></div>
    <div class="aw">
    <div class="brand">${MARK}<h1>SunoBolo</h1><p>${t().tagline}</p></div>
    <div class="apick">
      <button class="${up?'':'on'}" onclick="setAuthMode('in')">${t().signIn}</button>
      <button class="${up?'on':''}" onclick="setAuthMode('up')">${t().newAcc}</button>
    </div>
    <div class="acard">
      ${authErr ? `<div class="err">${authErr}</div>` : ''}
      ${up ? f('f_shop', t().shopN, 'autocomplete="organization"') : ''}
      ${up ? f('f_owner', t().ownerN, 'autocomplete="name"') : ''}
      ${f('f_phone', t().phone, 'type="tel" inputmode="numeric" maxlength="10" autocomplete="tel"')}
      ${f('f_pin', t().pin, 'type="password" inputmode="numeric" maxlength="4" class="pin"')}
      ${up ? f('f_pin2', t().pin2, 'type="password" inputmode="numeric" maxlength="4" class="pin"') : ''}
      <button class="big-btn" onclick="submitAuth()">${up ? t().create : t().enter}</button>
      ${googleClientId ? `<div class="orline">${t().orLine}</div><div id="gbtn"></div>
        <div class="ghint">${t().ghint}</div>` : ''}
    </div></div>`;
  if(googleClientId) drawGoogleButton();

/* Google Identity Services renders its own button - we only give it a slot.
   The library loads async, so this retries once rather than silently no-op. */
function drawGoogleButton(){
  const slot = document.getElementById('gbtn');
  if(!slot) return;
  if(!window.google?.accounts?.id) return void setTimeout(drawGoogleButton, 400);
  google.accounts.id.initialize({
    client_id: googleClientId,
    callback: onGoogleCredential,
    ux_mode: 'popup',
    // Without this the button can fail in total silence - no popup, no error,
    // nothing in the console - which is impossible for anyone to debug.
    error_callback: e => {
      authErr = 'Google: ' + (e?.type === 'popup_closed' ? 'window closed'
                : e?.type === 'popup_failed_to_open' ? 'popup blocked - allow popups for this site'
                : (e?.type || 'sign-in did not complete'));
      renderAuth();
    },
  });
  google.accounts.id.renderButton(slot, {
    theme:'outline', size:'large', shape:'pill', width: 280,
    text: authMode === 'up' ? 'signup_with' : 'signin_with',
    locale: lang === 'hi' ? 'hi' : lang === 'te' ? 'te' : 'en',
  });
}

async function onGoogleCredential(resp){
  try{
    const r = await api('/auth/google', {credential: resp.credential, lang});
    signedIn(r);
    // Google tells us a person, not a shop, so a brand new account still
    // needs a shop name. One field, asked once.
    if(r.needs_name) askShopName();
  }catch(e){
    authErr = e.message;
    renderAuth();
  }
}

function askShopName(){
  sheet(`<h3>${t().nameShop}</h3>
    <input class="search" id="s_name" value="${shopName}" autofocus>
    <button class="btn go wide" onclick="saveShopName()">${t().save}</button>`);
}

async function saveShopName(){
  const v = document.getElementById('s_name').value.trim();
  if(!v) return;
  const r = await api('/shop/name', {shop_name: v});
  shopName = r.shop_name;
  localStorage.setItem('sb_shop', shopName);
  closeSheet();
  render();
}

const setAuthMode = m => { authMode = m; authErr = ''; renderAuth(); };
const val = id => (document.getElementById(id)?.value || '').trim();

async function submitAuth(){
  const up = authMode === 'up';
  if(up && val('f_pin') !== val('f_pin2')){ authErr = t().pinBad; return renderAuth(); }
  try{
    const r = up
      ? await api('/register', {shop_name: val('f_shop'), owner_name: val('f_owner'),
                                phone: val('f_phone'), pin: val('f_pin'), lang})
      : await api('/login', {phone: val('f_phone'), pin: val('f_pin')});
    signedIn(r);
  }catch(e){
    authErr = e.message;
    renderAuth();
  }
}

// ─── landing ────────────────────────────────────────────
const SMALL_MARK = `<svg viewBox="0 0 64 64" width="26" height="26" aria-hidden="true">
  <defs><linearGradient id="gm" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#a855f7"/><stop offset="1" stop-color="#6366f1"/></linearGradient></defs>
  <circle cx="32" cy="32" r="30" fill="url(#gm)"/><circle cx="23" cy="32" r="6" fill="#fff"/>
  <path d="M33 21a15 15 0 0 1 0 22" stroke="#fff" stroke-width="5" fill="none" stroke-linecap="round"/>
  <path d="M42 14a24 24 0 0 1 0 36" stroke="#e9d5ff" stroke-width="5" fill="none" stroke-linecap="round"/></svg>`;

function renderLanding(){
  const F = [['ear','f1t','f1d'], ['globe','f2t','f2d'], ['box','f3t','f3d'],
             ['shield','f4t','f4d'], ['spark','f5t','f5d'], ['bell','f6t','f6d']];
  document.getElementById('landing').innerHTML = `
    <div class="lnav">
      <div class="lg">${SMALL_MARK} SunoBolo</div>
      <div class="mini">${['hi','te','en'].map(l =>
        `<button class="${l===lang?'on':''}" onclick="setLang('${l}');renderLanding()">${
          ({hi:'हिंदी',te:'తెలుగు',en:'EN'})[l]}</button>`).join('')}</div>
      <button class="theme-btn" onclick="toggleTheme()" aria-label="theme"></button>
      <button class="go" onclick="openAuth('in')">${t().signIn}</button>
    </div>

    <div class="hero">
      <div class="badge"><i>NEW</i> ${t().tagline}</div>
      <div class="waves"><i></i><i></i><i></i><b>${icon('wave',22)}</b></div>
      <h1>${t().heroA}<span>${t().heroB}</span></h1>
      <p>${t().heroSub}</p>
      <div class="cta">
        <button class="p" onclick="openAuth('up')">${t().start}</button>
        <button class="s" onclick="openAuth('in')">${t().already}</button>
      </div>
    </div>

    <div class="sect">
      <h2 class="rv">${t().featT}</h2>
      <div class="cards">${F.map(([ic,tk,dk],i) =>
        `<div class="fcard rv d${Math.min(i,5)}"><div class="ico">${icon(ic,20)}</div>
           <b>${t()[tk]}</b><span>${t()[dk]}</span></div>`).join('')}</div>
    </div>

    <div class="sect">
      <h2 class="rv">${t().howT}</h2>
      <div class="steps">${['s1','s2','s3'].map((k,i) =>
        `<div class="step-row rv d${i}"><em>${i+1}</em><span>${t()[k]}</span></div>`).join('')}</div>
    </div>

    <div class="lfoot rv">
      <button class="big-btn" style="max-width:280px;margin:0 auto"
        onclick="openAuth('up')">${t().start}</button>
    </div>`;
  observeReveals();
  applyTheme();
}

/* Reveal on scroll: one observer, and each element is unobserved once it has
   fired - no scroll handler, and no work left behind after things appear. */
let revealObs;
function observeReveals(){
  revealObs?.disconnect();
  revealObs = new IntersectionObserver(es => {
    for(const e of es) if(e.isIntersecting){ e.target.classList.add('in'); revealObs.unobserve(e.target); }
  }, {rootMargin:'0px 0px -8% 0px', threshold:.08});
  document.querySelectorAll('.rv:not(.in)').forEach(el => revealObs.observe(el));
}

function openAuth(mode){
  authMode = mode; authErr = '';
  document.body.classList.remove('land');
  document.body.classList.add('out');
  renderAuth();
}

function showLanding(){
  document.body.classList.remove('out');
  document.body.classList.add('land');
  renderLanding();
}

// ─── account sheet: sign-out lives here, nowhere near the language toggle ───
function accountMenu(){
  // anchored to the real header, whose height changes with the shop name
  const top = Math.round(document.querySelector('header').getBoundingClientRect().bottom) + 6;
  document.getElementById('sheet').innerHTML = `
    <div class="menuwrap" onclick="if(event.target===this)closeSheet()">
      <div class="menu" style="top:${top}px">
        <div class="mhead"><b>${shopName}</b><span id="mWho">${ownerName}</span></div>
        <div id="mStats"></div>
        <div class="msep"></div>
        <button class="mact" onclick="renameFromAccount()">${icon('pencil',17)} ${t().nameShop}</button>
        <button class="mact" onclick="toggleTheme();accountMenu()">${icon(theme==='dark'?'sun':'moon',17)} ${t().themeLbl}</button>
        <button class="mact dz" onclick="confirmSignOut()">${icon('logout',17)} ${t().logout}</button>
      </div></div>`;
  // details arrive from the server, so the menu opens instantly and fills in
  api('/me').then(me => {
    const who = document.getElementById('mWho');
    if(who) who.textContent = me.email || me.phone || ownerName;
    const box = document.getElementById('mStats');
    if(box) box.innerHTML =
        `<div class="mrow"><span>${t().ownerN}</span><b>${me.owner_name}</b></div>`
      + `<div class="mrow"><span>${t().stock}</span><b>${me.items} ${t().itemsWord}</b></div>`
      + `<div class="mrow"><span>${t().history}</span><b>${me.entries}</b></div>`;
  }).catch(() => {});
}

const renameFromAccount = () => { closeSheet(); askShopName(); };

function confirmSignOut(){
  // A second tap on purpose: signing out mid-shift throws away the pending tray.
  sheet(`<h2 style="margin:4px 0 16px;font-size:20px">${t().signOutQ}</h2>
    <div class="acts"><button class="btn" onclick="closeSheet()">${t().no}</button>
      <button class="btn go" style="background:var(--out)"
        onclick="closeSheet();signOut()">${t().logout}</button></div>`);
}

// ─── start ───
let googleClientId = '';

(async function boot(){
  if(token){ load(); return; }
  showLanding();                      // a first-time visitor should see what this is
  try{ googleClientId = (await api('/config')).google_client_id || ''; }catch{}
})();
</script>
